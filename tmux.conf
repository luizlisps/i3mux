# i3mux: an i3-inspired tmux pane configuration (tested with tmux 3.7c).
# Prefix: Ctrl-a. Reload: Ctrl-a Shift-r.
# A tmux window is a tab; a pane is a split within that window.
#
# Main bindings (after the prefix, except within a mode):
#   | / -          split left/right or top/bottom
#   h j k l        select the pane left/down/up/right
#   H J K L        swap panes without changing the layout
#   t              tiling mode: h/j/k/l moves the active pane to an edge
#   r              resize mode: h/j/k/l adjusts by 5 cells
#   R              reload this configuration
#   < / >          move the current window left/right among tabs
# Esc, q, or the mode's own key exits tiling/resize mode.

# Prefix and general behavior.
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind R source-file ~/.tmux.conf \; display-message 'tmux config reloaded'

set -g mouse on
set -g history-limit 100000
set -g escape-time 0
set -g focus-events on
set -g allow-passthrough on
set -g set-clipboard on
set -g base-index 1
set -g renumber-windows on
setw -g pane-base-index 1

# New windows and panes start in the active pane's directory.
bind c new-window -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# Navigation and swaps. Remove inherited bindings that compete for these
# keys or interfere with sequences sent to terminal programs.
unbind -n M-h
unbind -n M-j
unbind -n M-k
unbind -n M-l
unbind -T prefix M-h
unbind -T prefix M-j
unbind -T prefix M-k
unbind -T prefix M-l
unbind -T prefix Up
unbind -T prefix Down
unbind -T prefix Left
unbind -T prefix Right
unbind -T prefix M-Up
unbind -T prefix M-Down
unbind -T prefix M-Left
unbind -T prefix M-Right
unbind -T prefix o
unbind -T prefix ';'
unbind -T prefix q

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H swap-pane -d -t '{left-of}'
bind -r J swap-pane -d -t '{down-of}'
bind -r K swap-pane -d -t '{up-of}'
bind -r L swap-pane -d -t '{right-of}'

# Do not move windows beyond the first or last tab.
bind -r '<' if-shell -F '#{!=:#{window_start_flag},1}' 'swap-window -d -t -1'
bind -r '>' if-shell -F '#{!=:#{window_end_flag},1}' 'swap-window -d -t +1'

# Key tables consume one key at a time; switch-client re-enters the mode
# after each action. refresh-client updates the status bar.
bind r switch-client -T resize \; refresh-client -S
bind -T resize h resize-pane -L 5 \; switch-client -T resize \; refresh-client -S
bind -T resize j resize-pane -D 5 \; switch-client -T resize \; refresh-client -S
bind -T resize k resize-pane -U 5 \; switch-client -T resize \; refresh-client -S
bind -T resize l resize-pane -R 5 \; switch-client -T resize \; refresh-client -S
bind -T resize Escape switch-client -T root \; refresh-client -S
bind -T resize r switch-client -T root \; refresh-client -S
bind -T resize q switch-client -T root \; refresh-client -S

# Tiling: -f splits across the full window height/width. Only the active
# pane moves; the other panes keep their grouping. -b chooses left/top;
# otherwise, right/bottom. {next} selects another pane in the same window,
# including when the active one is last. H/V in the bar shows the current
# tiling orientation. At least two panes are required.
unbind '{'
unbind '}'
bind t switch-client -T tile-horizontal \; refresh-client -S
bind -T tile-horizontal h move-pane -f -h -b -t '{next}' \; switch-client -T tile-horizontal \; refresh-client -S
bind -T tile-horizontal l move-pane -f -h -t '{next}' \; switch-client -T tile-horizontal \; refresh-client -S
bind -T tile-horizontal j move-pane -f -v -t '{next}' \; switch-client -T tile-vertical \; refresh-client -S
bind -T tile-horizontal k move-pane -f -v -b -t '{next}' \; switch-client -T tile-vertical \; refresh-client -S
bind -T tile-vertical h move-pane -f -h -b -t '{next}' \; switch-client -T tile-horizontal \; refresh-client -S
bind -T tile-vertical l move-pane -f -h -t '{next}' \; switch-client -T tile-horizontal \; refresh-client -S
bind -T tile-vertical j move-pane -f -v -t '{next}' \; switch-client -T tile-vertical \; refresh-client -S
bind -T tile-vertical k move-pane -f -v -b -t '{next}' \; switch-client -T tile-vertical \; refresh-client -S
bind -T tile-horizontal Escape switch-client -T root \; refresh-client -S
bind -T tile-horizontal t switch-client -T root \; refresh-client -S
bind -T tile-horizontal q switch-client -T root \; refresh-client -S
bind -T tile-vertical Escape switch-client -T root \; refresh-client -S
bind -T tile-vertical t switch-client -T root \; refresh-client -S
bind -T tile-vertical q switch-client -T root \; refresh-client -S

# Vi-style copy mode; y copies to the tmux buffer.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Terminal and theme. The palette is self-contained.
set -g default-terminal 'tmux-256color'
# Add RGB only once, including after Ctrl-a Shift-r.
if-shell -F '#{!:#{m:*xterm-256color:RGB*,#{terminal-features}}}' "set -as terminal-features ',xterm-256color:RGB'"
set -g @theme_bg '#111111'
set -g @theme_fg '#f5f5f5'
set -g @theme_muted '#b4b4b4'
set -g @theme_accent '#8ab4f8'
set -g @theme_branch '#d2a8ff'
set -g @theme_time '#56d4dd'
set -g @theme_border '#30363d'
set -g @theme_pane_active '#8ab4f8'
set -g message-style 'bg=#1c1c1c,fg=#8ab4f8'
set -g message-command-style 'bg=#1c1c1c,fg=#8ab4f8'
set -g display-panes-active-colour '#8ab4f8'
set -g display-panes-colour '#d2a8ff'
set -g clock-mode-colour '#56d4dd'

# Top bar: branch on the left; session and windows in the center; directory,
# date/time, and active mode on the right. Keep the mode indicator last so
# it stays visible when space is limited.
set -g status-interval 5
set -g status-position top
set -g status-justify absolute-centre
set -g status-style 'bg=#{@theme_bg},fg=#{@theme_fg}'
set -g status-left-style 'bg=#{@theme_bg},fg=#{@theme_fg}'
set -g window-status-format '#[fg=#{@theme_muted}]#I:#W #[default]'
set -g window-status-current-format '#[fg=#{@theme_accent},bold]#I:#W #[default]'
set -g status-left '#[fg=#{@theme_branch},bg=#{@theme_bg},bold]#(git -C #{q:pane_current_path} branch --show-current 2>/dev/null | sed "s/.*/[&]/")#[fg=#{@theme_fg},bg=#{@theme_bg}] '
set -g @status-mode '#{?#{==:#{client_key_table},resize},#[fg=#{@theme_accent}][RESIZE] ,}#{?#{==:#{client_key_table},tile-horizontal},#[fg=#{@theme_accent}][TILE H] ,}#{?#{==:#{client_key_table},tile-vertical},#[fg=#{@theme_accent}][TILE V] ,}'
set -g status-right '#[fg=#{@theme_accent}][#{s|^.*/([^/]+/[^/]+)$|\1|:pane_current_path}] #[fg=#{@theme_muted}]| #[fg=#{@theme_time}]%Y/%m/%d %H:%M #{E:@status-mode}#[default]'
# status-format positions the three areas; E expands status options and
# T expands date/time codes in status-right.
set -g status-format[0] '#[align=left]#{E:status-left}#[list=on align=absolute-centre]#[fg=#{@theme_branch},bold]@#S #[default]#{W:#[range=window|#{window_index}]#{E:window-status-format}#[norange],#[range=window|#{window_index}]#{E:window-status-current-format}#[norange]}#[nolist]#[align=right]#{T:status-right}'

# Pane borders: neutral when inactive, accented when active.
set -g pane-border-status off
set -g pane-border-style 'fg=#{@theme_border}'
set -g pane-active-border-style 'fg=#{@theme_pane_active},bold'
set -g pane-border-lines simple
