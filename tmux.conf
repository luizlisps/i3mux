# i3mux: an i3-inspired tmux pane configuration (tested with tmux 3.7c).
# Prefix: Ctrl-a. Reload: Ctrl-a Shift-r.
# A tmux window is a tab; a pane is a split within that window.
#
# Main bindings (after the prefix, except within a mode):
#   | / -          split left/right or top/bottom
#   h j k l        select the pane left/down/up/right
#   H J K L        swap panes without changing the layout
#   t              tiling mode: h/j/k/l moves the active pane to an edge
#   r              resize mode: h/j/k/l adjusts by 5 cells
#   R              reload this configuration
#   < / >          move the current window left/right among tabs
# Esc, q, or the mode's own key exits tiling/resize mode.

# Prefix and general behavior.
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind R source-file ~/.tmux.conf \; display-message 'tmux config reloaded'

set -g mouse on
set -g history-limit 100000
set -g escape-time 0
set -g focus-events on
set -g allow-passthrough on
set -g set-clipboard on
set -g base-index 1
set -g renumber-windows on
setw -g pane-base-index 1

# New windows and panes start in the active pane's directory.
bind c new-window -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# Navigation and swaps. Remove inherited bindings that compete for these
# keys or interfere with sequences sent to terminal programs.
unbind -n M-h
unbind -n M-j
unbind -n M-k
unbind -n M-l
unbind -T prefix M-h
unbind -T prefix M-j
unbind -T prefix M-k
unbind -T prefix M-l
unbind -T prefix Up
unbind -T prefix Down
unbind -T prefix Left
unbind -T prefix Right
unbind -T prefix M-Up
unbind -T prefix M-Down
unbind -T prefix M-Left
unbind -T prefix M-Right
unbind -T prefix o
unbind -T prefix ';'
unbind -T prefix q

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H swap-pane -d -t '{left-of}'
bind -r J swap-pane -d -t '{down-of}'
bind -r K swap-pane -d -t '{up-of}'
bind -r L swap-pane -d -t '{right-of}'

# Do not move windows beyond the first or last tab.
bind -r '<' if-shell -F '#{!=:#{window_start_flag},1}' 'swap-window -d -t -1'
bind -r '>' if-shell -F '#{!=:#{window_end_flag},1}' 'swap-window -d -t +1'

# Key tables consume one key at a time; switch-client re-enters the mode
# after each action. refresh-client updates the status bar.
bind r switch-client -T resize \; refresh-client -S
bind -T resize h resize-pane -L 5 \; switch-client -T resize \; refresh-client -S
bind -T resize j resize-pane -D 5 \; switch-client -T resize \; refresh-client -S
bind -T resize k resize-pane -U 5 \; switch-client -T resize \; refresh-client -S
bind -T resize l resize-pane -R 5 \; switch-client -T resize \; refresh-client -S
bind -T resize Escape switch-client -T root \; refresh-client -S
bind -T resize r switch-client -T root \; refresh-client -S
bind -T resize q switch-client -T root \; refresh-client -S

# Tiling: -f splits across the full window height/width. Only the active
# pane moves; the other panes keep their grouping. -b chooses left/top;
# otherwise, right/bottom. {next} selects another pane in the same window,
# including when the active one is last. H/V in the bar shows the current
# tiling orientation.
# A key does nothing when the pane already spans that edge (or is alone):
# repeating the move would split the window again and crush the others.
# After a move, select-layout -E evens out the moved pane and the rest.
set -g @tile-left   '#{||:#{==:#{window_panes},1},#{&&:#{pane_at_left},#{==:#{pane_height},#{window_height}}}}'
set -g @tile-right  '#{||:#{==:#{window_panes},1},#{&&:#{pane_at_right},#{==:#{pane_height},#{window_height}}}}'
set -g @tile-top    '#{||:#{==:#{window_panes},1},#{&&:#{pane_at_top},#{==:#{pane_width},#{window_width}}}}'
set -g @tile-bottom '#{||:#{==:#{window_panes},1},#{&&:#{pane_at_bottom},#{==:#{pane_width},#{window_width}}}}'
unbind '{'
unbind '}'
bind t switch-client -T tile-horizontal \; refresh-client -S
bind -T tile-horizontal h if-shell -F '#{E:@tile-left}' '' { move-pane -f -h -b -t '{next}' ; select-layout -E -t '{next}' ; select-layout -E } \; switch-client -T tile-horizontal \; refresh-client -S
bind -T tile-horizontal l if-shell -F '#{E:@tile-right}' '' { move-pane -f -h -t '{next}' ; select-layout -E -t '{next}' ; select-layout -E } \; switch-client -T tile-horizontal \; refresh-client -S
bind -T tile-horizontal j if-shell -F '#{E:@tile-bottom}' '' { move-pane -f -v -t '{next}' ; select-layout -E -t '{next}' ; select-layout -E } \; switch-client -T tile-vertical \; refresh-client -S
bind -T tile-horizontal k if-shell -F '#{E:@tile-top}' '' { move-pane -f -v -b -t '{next}' ; select-layout -E -t '{next}' ; select-layout -E } \; switch-client -T tile-vertical \; refresh-client -S
bind -T tile-vertical h if-shell -F '#{E:@tile-left}' '' { move-pane -f -h -b -t '{next}' ; select-layout -E -t '{next}' ; select-layout -E } \; switch-client -T tile-horizontal \; refresh-client -S
bind -T tile-vertical l if-shell -F '#{E:@tile-right}' '' { move-pane -f -h -t '{next}' ; select-layout -E -t '{next}' ; select-layout -E } \; switch-client -T tile-horizontal \; refresh-client -S
bind -T tile-vertical j if-shell -F '#{E:@tile-bottom}' '' { move-pane -f -v -t '{next}' ; select-layout -E -t '{next}' ; select-layout -E } \; switch-client -T tile-vertical \; refresh-client -S
bind -T tile-vertical k if-shell -F '#{E:@tile-top}' '' { move-pane -f -v -b -t '{next}' ; select-layout -E -t '{next}' ; select-layout -E } \; switch-client -T tile-vertical \; refresh-client -S
bind -T tile-horizontal Escape switch-client -T root \; refresh-client -S
bind -T tile-horizontal t switch-client -T root \; refresh-client -S
bind -T tile-horizontal q switch-client -T root \; refresh-client -S
bind -T tile-vertical Escape switch-client -T root \; refresh-client -S
bind -T tile-vertical t switch-client -T root \; refresh-client -S
bind -T tile-vertical q switch-client -T root \; refresh-client -S

# Vi-style copy mode; y copies to the tmux buffer.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Terminal and theme. The palette is self-contained.
set -g default-terminal 'tmux-256color'
# Add RGB only once, including after Ctrl-a Shift-r.
if-shell -F '#{!:#{m:*xterm-256color:RGB*,#{terminal-features}}}' "set -as terminal-features ',xterm-256color:RGB'"
set -g @theme_bg '#111111'
set -g @theme_fg '#f5f5f5'
set -g @theme_muted '#b4b4b4'
set -g @theme_accent '#8ab4f8'
set -g @theme_focus_fg '#111111'
set -g @theme_border '#30363d'
set -g @theme_pane_active '#8ab4f8'
set -g message-style 'bg=#{@theme_accent},fg=#{@theme_focus_fg},bold'
set -g message-command-style 'bg=#{@theme_accent},fg=#{@theme_focus_fg},bold'
# Prompts overlay the status line; fill its width to hide windows behind them.
set -g message-format '#[fill=#{@theme_accent}]#[#{?#{command_prompt},#{E:message-command-style},#{E:message-style}}]#{message}'
set -g display-panes-active-colour '#8ab4f8'
set -g display-panes-colour '#d2a8ff'
set -g clock-mode-colour '#56d4dd'

# Numbered workspaces on the left; tiling/resize mode on the right.
# Keep the default status format for focus, activity, and bell indicators.
set -g status-interval 5
set -g status-position top
set -g status-justify left
set -g status-style 'bg=#{@theme_bg},fg=#{@theme_fg}'
set -g status-left ''
set -g window-status-separator ''
set -g window-status-style 'bg=#{@theme_bg},fg=#{@theme_muted}'
set -g window-status-current-style 'bg=#{@theme_accent},fg=#{@theme_focus_fg},bold'
set -g window-status-activity-style 'bg=#{@theme_accent},fg=#{@theme_focus_fg},bold'
set -g window-status-bell-style 'bg=#{@theme_accent},fg=#{@theme_focus_fg},bold'
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '
# Style fields are separate directives so commas do not split conditions.
set -g @status-mode '#{?#{==:#{client_key_table},resize},#[bg=#{@theme_accent}][fg=#{@theme_focus_fg}][bold] RESIZE ,}#{?#{==:#{client_key_table},tile-horizontal},#[bg=#{@theme_accent}][fg=#{@theme_focus_fg}][bold] TILE H ,}#{?#{==:#{client_key_table},tile-vertical},#[bg=#{@theme_accent}][fg=#{@theme_focus_fg}][bold] TILE V ,}'
set -g status-right '#{E:@status-mode}#[default]'
set -gu status-format

# Pane borders: neutral when inactive, accented when active.
set -g pane-border-status off
set -g pane-border-style 'fg=#{@theme_border}'
set -g pane-active-border-style 'fg=#{@theme_pane_active},bold'
set -g pane-border-lines simple
